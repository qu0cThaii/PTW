<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PTW & LOTO – Observation Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f2;--surface:#ffffff;--ink:#17211d;--muted:#5f6c66;--line:#dde2dd;--soft:#eef1ed;
  --accent:#0f6b54;--accent-ink:#ffffff;--accent-soft:#dff0ea;
  --good:#187a4b;--good-soft:#e0f2e8;--bad:#b42318;--bad-soft:#fde8e6;--warn:#a15c07;--warn-soft:#fdf0d9;
  --plan:#d6dcd7;--shadow:0 1px 2px rgba(20,30,25,.06),0 4px 14px rgba(20,30,25,.05);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111614;--surface:#1a211e;--ink:#e8eee9;--muted:#98a59d;--line:#2c3631;--soft:#222b27;
    --accent:#3fb994;--accent-ink:#06231a;--accent-soft:#1c3a2f;
    --good:#4fc98a;--good-soft:#1b3427;--bad:#f18277;--bad-soft:#3d1e1b;--warn:#e8a94b;--warn-soft:#3a2c12;
    --plan:#34403a;--shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#111614;--surface:#1a211e;--ink:#e8eee9;--muted:#98a59d;--line:#2c3631;--soft:#222b27;
  --accent:#3fb994;--accent-ink:#06231a;--accent-soft:#1c3a2f;
  --good:#4fc98a;--good-soft:#1b3427;--bad:#f18277;--bad-soft:#3d1e1b;--warn:#e8a94b;--warn-soft:#3a2c12;
  --plan:#34403a;--shadow:none;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:auto;min-height:100%;background:var(--bg);color:var(--ink);font:14.5px/1.5 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 96px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 0 10px}
header.top h1{font-size:18px;margin:0;font-weight:600;letter-spacing:-.01em}
header.top .sub{color:var(--muted);font-size:12.5px}
.grow{flex:1}
.save-st{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good)}
nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:18px}
nav.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
nav.tabs button:hover{color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.pad{padding:16px}
h2{font-size:15px;margin:0 0 4px;font-weight:600}
h3{font-size:14px;margin:0 0 10px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:9px;cursor:pointer;font-weight:500;line-height:1.2}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:7px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{resize:vertical;min-height:64px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:500}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.bar-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar-row input,.bar-row select{width:auto;min-width:0}
.bar-row input[type=search]{flex:1;min-width:160px}
.stat{padding:14px 16px}
.stat .k{font-size:12px;color:var(--muted);font-weight:500}
.stat .v{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.stat .v small{font-size:14px;color:var(--muted);font-weight:500}
.stat .s{font-size:12px;color:var(--muted)}
.tw{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;color:var(--muted);text-align:left;font-weight:500;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--soft)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tfoot td{font-weight:600;background:var(--soft)}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--soft);white-space:nowrap;font-weight:500}
.tag.good{background:var(--good-soft);color:var(--good)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.pb{height:7px;background:var(--soft);border-radius:9px;overflow:hidden;min-width:70px}
.pb i{display:block;height:100%;background:var(--accent);border-radius:9px}
.pb i.full{background:var(--good)}
.tbl input.cell{padding:5px 7px;border-radius:6px;min-width:64px}
.tbl input.rm{min-width:150px}
.acts{display:flex;gap:6px;white-space:nowrap}
/* audit form */
.chk{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;margin-bottom:10px}
.chk.r-yes{border-left:4px solid var(--good)}
.chk.r-no{border-left:4px solid var(--bad);background:linear-gradient(0deg,var(--surface),var(--surface))}
.chk.r-na{border-left:4px solid var(--muted)}
.chk.err{outline:2px solid var(--bad)}
.chk-top{display:flex;gap:12px;align-items:center}
.chk .num{font:500 13px 'IBM Plex Mono',ui-monospace,monospace;color:var(--muted);min-width:22px}
.chk .txt{flex:1}
.chk .en{font-weight:500}
.chk .vi{color:var(--muted);font-size:12.5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex-shrink:0}
.seg button{background:var(--surface);border:0;padding:8px 14px;cursor:pointer;font-weight:500;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on.yes{background:var(--good);color:#fff}
.seg button.on.no{background:var(--bad);color:#fff}
.seg button.on.na{background:var(--muted);color:var(--surface)}
.detail{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.photos .ph{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--line);cursor:pointer}
.photos .ph img{width:100%;height:100%;object-fit:cover;display:block}
.photos .ph b{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;width:18px;height:18px;border-radius:50%;font-size:12px;line-height:18px;text-align:center;font-weight:500}
.sticky{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);z-index:20}
.sticky .in{max-width:1180px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
/* modal & toast */
#modal{position:fixed;inset:0;background:rgba(10,15,12,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.on{display:flex}
#modal .box{background:var(--surface);border-radius:14px;max-width:560px;width:100%;max-height:90%;overflow:auto;padding:20px;border:1px solid var(--line)}
#modal .box.wide{max-width:760px}
#modal .box img.big{max-width:100%;display:block;border-radius:8px}
.fld{margin-bottom:12px}
.row-btn{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90%;text-align:center}
#toast.on{opacity:1}
.drop{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.empty{padding:34px;text-align:center;color:var(--muted)}
@media (max-width:860px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:760px){
  .g2,.g3{grid-template-columns:1fr}
  .chk-top{flex-wrap:wrap}.seg{width:100%}.seg button{flex:1}
  table.resp thead{display:none}
  table.resp,table.resp tbody,table.resp tr,table.resp td{display:block;width:100%}
  table.resp tr{padding:10px 12px;border-bottom:1px solid var(--line)}
  table.resp td{border:0;padding:2px 0}
  table.resp td[data-l]::before{content:attr(data-l) ' · ';color:var(--muted);font-size:12px}
  table.resp td.hide-m{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>PTW & LOTO – Observation Tracker</h1>
      <div class="sub">Nhập audit · Nhật ký observation · KPI 2026</div>
    </div>
    <div class="grow"></div>
    <div class="save-st" id="saveSt"><span class="dot"></span><span id="saveTx">Đang tải…</span></div>
    <button class="btn sm" data-act="theme" title="Đổi giao diện sáng/tối">Sáng / Tối</button>
  </header>
  <nav class="tabs" id="tabs">
    <button data-tab="kpi">Tổng quan KPI</button>
    <button data-tab="obs">Nhật ký Observation</button>
    <button data-tab="audit">Audit checklist</button>
    <button data-tab="plan">Kế hoạch 2026</button>
    <button data-tab="data">Nhập / Xuất dữ liệu</button>
  </nav>
  <main id="main"></main>
</div>
<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>

<script>

ng, indicating non-compliance with the confined space procedure. This may lead to entry into an unsafe atmosphere (e.g., low oxygen or presence of toxic/flammable gases), posing serious risk to personnel."}, {"id": "s006", "date": "2026-03-17", "item": "PTW&LOTO audit", "title": "Not finished Pre job briefing form (PTW No.31980)", "desc": "Pre-Job Briefing Form was not completed before work execution, indicating non-compliance with procedure and increasing the risk of unclear hazards, controls, and miscommunication among workers."}, {"id": "s007", "date": "2026-03-20", "item": "PTW&LOTO audit", "title": "Regular inspection Roots Blower (No. 3) for Ash Silo (3 months) (PTW No.31980)", "desc": "Good action"}, {"id": "s008", "date": "2026-03-20", "item": "PTW&LOTO audit", "title": "Inspect the strainer for FF system at TT5, TT10, Coal control building, CYWWTS building (PTW No.31948)", "desc": "Good action"}, {"id": "s009", "date": "2026-04-17", "item": "PTW&LOTO audit", "title": "Poor housekeeping and missing safety warning tape at work area (PTW No. 31386)", "desc": "The work area was not properly organized, creating potential hazards. No safety warning tape was installed to isolate the working zone during touch-up painting activities at coal transport area."}, {"id": "s010", "date": "2026-04-17", "item": "PTW&LOTO audit", "title": "Incomplete entry log form before starting work (PTW No. 32960)", "desc": "The entry/exit log form was not fully completed and signed before performing maintenance work on CCWP 1A at Unit 1 Steam Turbine Building."}, {"id": "s011", "date": "2026-04-16", "item": "PTW&LOTO audit", "title": "Check the lighting of TT12 (PTW No.32653)", "desc": "Good action"}, {"id": "s012", "date": "2026-04-21", "item": "PTW&LOTO audit", "title": "Work conducted without PTW and improper spill control during painting (PTW No.32806)", "desc": "Painting work on CO₂ and CH₄ cabinets was carried out without a valid Permit to Work (PTW) at the site. In addition, no spill containment or floor protection was provided, creating a risk of paint leakage and contamination."}, {"id": "s013", "date": "2026-04-21", "item": "PTW&LOTO audit", "title": "Incomplete documentation and incorrect lifting information (PTW No. 33065)", "desc": "Personnel information was not fully recorded in the pre-job briefing and entry log before starting the work. Additionally, incorrect load details were provided in the lifting certificate during silencer installation at FGD Electrical Building."}, {"id": "s014", "date": "2026-04-24", "item": "PTW&LOTO audit", "title": "Inspection and filling holes on outside lighting T5 & T7 (PTW No.33269)", "desc": "Good action"}, {"id": "s015", "date": "2026-04-24", "item": "PTW&LOTO audit", "title": "Replace the lining plate of BC-1A/B to BC-2A/B.", "desc": "Electrical equipment had not been inspected prior to use. The work area was not properly organized, leading to poor housekeeping conditions."}, {"id": "s016", "date": "2026-04-15", "item": "PTW&LOTO audit", "title": "Check the lighting of TT12 (PTW No.32653)", "desc": "The crew sign on/off form was not fully completed before and after the work activities."}, {"id": "s017", "date": "2026-04-11", "item": "PTW&LOTO audit", "title": "Checking lifting motor of T10 crane (PTW No.32530)", "desc": "Personal protective equipment was not worn correctly in accordance with safety requirements during work activities."}, {"id": "s018", "date": "2026-03-31", "item": "PTW&LOTO audit", "title": "Replace Fire Detector module 10CYE11 MO069-S01 GE- HOUSING TURBINE BUILDING #1 (PTW No. 32198)", "desc": "The pre-job briefing form was not fully completed before starting the work activities."}, {"id": "s019", "date": "2026-03-28", "item": "PTW&LOTO audit", "title": "Inspection and maintenance for ESP Unit 1( PTW No. 32268)", "desc": "The pre-job briefing form was not fully completed before starting the work activities."}, {"id": "s020", "date": "2026-04-13", "item": "PTW&LOTO audit", "title const fromSerial = n=>new Date(Date.UTC(1899,11,30)+Math.round(n)*864e5).toISOString().slice(0,10);
function parseDate(v){
  if(v==null||v==='') return null;
  if(v instanceof Date) return v.getFullYear()+'-'+p2(v.getMonth()+1)+'-'+p2(v.getDate());
  if(typeof v==='number') return (v>20000&&v<80000)?fromSerial(v):null;
  const s=String(v).trim(); let m;
  if(/^\d{5}$/.test(s)) return fromSerial(+s);
  if((m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})/))) return m[3]+'-'+p2(m[2])+'-'+p2(m[1]);
  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return m[0];
  return null;
}

/* ---------- KPI logic ---------- */
function periodStart(a=S.asOf){
  const sd=S.cycleDay,y=+a.slice(0,4),m=+a.slice(5,7),d=+a.slice(8,10);
  if(sd<=1)return a.slice(0,7)+'-01';
  if(d>=sd)return y+'-'+p2(m)+'-'+p2(sd);
  const pm=m===1?12:m-1,py=m===1?y-1:y;return py+'-'+p2(pm)+'-'+p2(sd);
}
// Kỳ KPI tháng gắn với mốc chốt: nếu ngày hiện tại (asOf) đã qua mốc chốt (>= cycleDay), kỳ tính là tháng kế tiếp trên Bảng kế hoạch.
function planMonthIndex(a=S.asOf){const m=+a.slice(5,7)-1,d=+a.slice(8,10);return (S.cycleDay>1&&d>=S.cycleDay)?(m+1)%12:m}
// Quy 1 ngày bất kỳ (VD ngày của 1 observation/audit) về đúng {năm,tháng} KPI mà nó thuộc về, theo cùng quy tắc chốt kỳ ở trên.
function cycleTarget(dateStr){
  const yy=+dateStr.slice(0,4),mm=+dateStr.slice(5,7)-1,dd=+dateStr.slice(8,10);
  if(S.cycleDay<=1)return {y:yy,m:mm};
  if(dd>=S.cycleDay){const nm=(mm+1)%12,ny=mm===11?yy+1:yy;return {y:ny,m:nm}}
  return {y:yy,m:mm};
}
const cnt=(from,to)=>S.records.filter(r=>r.item===KPI_ITEM&&r.date>=from&&r.date<=to).length;
const sumArr=a=>a.reduce((x,y)=>x+(+y||0),0);
function kpiRow(){
  const a=S.asOf,y=a.slice(0,4),mi=planMonthIndex(a),ys=y+'-01-01',plan=S.plan[KPI_ITEM];
  const tm=+plan[mi]||0,am=cnt(periodStart(a),a);
  const ty=sumArr(plan.slice(0,mi+1)),ay=cnt(ys,a);
  return {it:KPI_ITEM,mi,tm,am,ty,ay};
}

function chartSVG(){
  const y=+S.asOf.slice(0,4),plan=S.plan[KPI_ITEM].map(v=>+v||0),act=Array(12).fill(0);
  S.records.forEach(r=>{if(r.item!==KPI_ITEM)return;const t=cycleTarget(r.date);if(t.y===y)act[t.m]++});
  const mx=Math.max(1,...plan,...act),W=720,H=240,L=38,B=26,T=14,cw=(W-L-6)/12,ph=H-B-T;
  const Y=v=>T+ph-(v/mx)*ph;let g='';
  for(let i=0;i<=4;i++){const v=Math.round(mx*i/4);g+=`<line x1="${L}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`}
  for(let i=0;i<12;i++){
    const x=L+i*cw+cw*.14,w=cw*.72;
    g+=`<rect x="${x}" y="${Y(plan[i])}" width="${w}" height="${T+ph-Y(plan[i])}" rx="3" fill="var(--plan)"/>`;
    if(act[i]>0)g+=`<rect x="${x+w*.22}" y="${Y(act[i])}" width="${w*.56}" height="${T+ph-Y(act[i])}" rx="3" fill="var(--accent)"/><text x="${x+w/2}" y="${Y(act[i])-4}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">${act[i]}</text>`;
    g+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${MON[i]}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Biểu đồ kế hoạch và thực tế theo tháng">${g}</svg>`;
}

function tsvParse(t){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"'&&cur==='')q=true;
    else if(c==='\t'){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}
    else cur+=c;}
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()));
}
function rowsToRecords(rows){
  const out=[];
  rows.forEach(c=>{
    c=c.map(x=>String(x==null?'':x).trim());
    let s=-1,d=parseDate(c[0]);
    if(d)s=0;else if((d=parseDate(c[1])))s=1;
    if(s<0)return;
    const rest=c.slice(s+1),it=normItem(rest[0]);
    const title=it?rest[1]||'':rest[0]||'',desc=it?rest[2]||'':rest[1]||'';
    if(!title&&!desc)return;
    out.push({id:uid(),date:d,item:KPI_ITEM,title,desc});
  });
  return out;
}
const keyOf=r=>[r.date,r.title.toLowerCase(),(r.desc||'').toLowerCase()].join('|');
function mergeRecords(list){
  const have=new Set(S.records.map(keyOf));let n=0;
  list.forEach(r=>{if(!have.has(keyOf(r))){S.records.push(r);have.add(keyOf(r));n++}});
  return n;
}

function compress(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const M=1100,k=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.src=fr.result};fr.readAsDataURL(file)})}

  if(!D.date||!D.job.trim()){toast('Cần nhập Ngày và Mô tả công việc');return}
  for(let n=1;n<=20;n++){if(!D.items[n].r){toast('Mục '+n+' chưa chọn Yes / No / N/A');$('#row-'+n).classList.add('err');$('#row-'+n).scrollIntoView({block:'center',behavior:'smooth'});return}}

  const a=JSON.parse(JSON.stringify(D));

/* Nhúng ảnh audit vào ô Excel (thumbnail xếp dọc trong ô), trả về ghi chú "+N ảnh khác" nếu vượt cap */
function addPhotoThumbs(wb,ws,photos,row,colIdx,cap){
  photos=photos||[];if(!photos.length)return '';
  const shown=photos.slice(0,cap),extra=photos.length-shown.length;
  const W=64,H=46,GAP=4,n=shown.length,pad=extra>0?16:6;
  const totalPx=n*H+(n-1)*GAP+pad;
  row.height=Math.max(row.height||0,totalPx*0.75);
  shown.forEach((p,i)=>{
    const m=/^data:image\/(\w+);base64,/.exec(p);if(!m)return;
    try{
      const imgId=wb.addImage({base64:p,extension:m[1]==='jpg'?'jpeg':m[1]});
      ws.addImage(imgId,{tl:{col:colIdx+0.08,row:(row.number-1)+(i*(H+GAP))/totalPx},ext:{width:W,height:H}});
    }catch(e){}
  });
  return extra>0?('+'+extra+' ảnh khác'):'';
}

async function handleFile(f){
  if(!f)return;const name=f.name;
  try{
    if(/\.json$/i.test(name)){
      const j=JSON.parse(await f.text());
      if(!j||!Array.isArray(j.records)){toast('File JSON không đúng định dạng');return}
      if(await confirmBox('Khôi phục sao lưu sẽ thay thế toàn bộ dữ liệu hiện tại. Tiếp tục?','Khôi phục')){S=normalizeState(j);saveSoon();render();toast('Đã khôi phục sao lưu')}
      return;
    }
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),out=[];
    wb.SheetNames.forEach(sn=>{
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''});
      let hi=-1,ci={};
      for(let i=0;i<Math.min(rows.length,40);i++){
        const low=rows[i].map(x=>String(x).trim().toLowerCase());
        if(low.includes('date')&&(low.includes('title')||low.includes('description'))){hi=i;ci={date:low.indexOf('date'),item:low.indexOf('item'),title:low.indexOf('title'),desc:low.indexOf('description')};break}
      }
      if(hi<0)return;
      for(let i=hi+1;i<rows.length;i++){
        const r=rows[i],d=parseDate(r[ci.date]);if(!d)continue;
        const title=String(ci.title>=0?r[ci.title]:'').trim(),desc=String(ci.desc>=0?r[ci.desc]:'').trim();
        if(!title&&!desc)continue;
        out.push({id:uid(),date:d,item:KPI_ITEM,title,desc});
      }
    });
    askImport(out,name);
  }catch(e){toast('Không đọc được file: '+(e.message||'lỗi'))}
}

    case 'rec-regen':D.recTitleManual=D.recDescManual=false;autoRec();break;
    case 'photo-del':e.stopPropagation();D.items[n].photos.splice(+el.dataset.i,1);refreshRow(n);break;
    case 'photo-view':openModal(`<img class="big" src="${D.items[n].photos[+el.dataset.i]}" alt="Ảnh hiện trường"><div class="row-btn"><button class="btn" data-act="modal-close">Đóng</button></div>`);break;
    case 'exp-all':await exportAll();break;
    case 'exp-json':saveFile('PTW_LOTO_backup_'+today()+'.json',JSON.stringify(S));break;
    case 'imp-merge':{const k=mergeRecords(window._imp||[]);saveSoon();closeModal();render();toast('Đã thêm '+k+' dòng mới');break}
    case 'imp-replace':S.records=window._imp||[];saveSoon();closeModal();render();toast('Đã thay thế nhật ký ('+S.records.length+' dòng)');break;
    case 'load-seed':if(await confirmBox('Nạp lại dữ liệu mẫu sẽ thay thế toàn bộ dữ liệu hiện tại. Tiếp tục?','Nạp lại')){S=seedState();saveSoon();render();toast('Đã nạp dữ liệu mẫu')}break;
    case 'reset':if(await confirmBox('Xoá toàn bộ nhật ký, audit và ảnh? Không thể hoàn tác.','Xoá tất cả')){S=normalizeState({records:[],audits:[],plan:S.plan,asOf:today()});saveSoon();render();toast('Đã xoá dữ liệu')}break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.filter){F[t.dataset.filter]=t.value;obsBody();return}
  if(t.dataset.asof!==undefined){if(t.value){S.asOf=t.value;saveSoon();render()}return}
  if(t.dataset.cycleday){S.cycleDay=Math.min(28,Math.max(1,Math.round(+t.value)||1));saveSoon();render();return}
  if(t.dataset.remark){S.remarks[t.dataset.remark]=t.value;saveSoon();return}
  if(t.dataset.plan){S.plan[KPI_ITEM][+t.dataset.m]=Math.max(0,+t.value||0);refreshPlanSums();saveSoon();return}
  if(!D)return;
  if(t.dataset.f){D.items[t.dataset.n][t.dataset.f]=t.value;if(t.dataset.f==='finding')autoRec();return}
  if(t.dataset.h){
    const k=t.dataset.h;
    if(k==='makeRec'){D.makeRec=t.checked;return}
    D[k]=t.value;
    if(k==='recTitle')D.recTitleManual=true;else if(k==='recDesc')D.recDescManual=true;else if(k==='ptw'||k==='job')autoRec();
  }
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='impFile'){handleFile(t.files[0]);t.value='';return}
  if(t.dataset.photo&&D){
    const n=t.dataset.photo;
    for(const f of [...t.files]){try{D.items[n].photos.push(await compress(f))}catch(err){toast('Không đọc được ảnh')}}
    refreshRow(n);
  }
});
document.addEventListener('dragover',e=>{const d=e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest('#drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest('#drop');if(d){e.preventDefault();d.classList.remove('over');handleFile(e.dataTransfer.files[0])}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* ---------- boot ---------- */
(async function(){
  idb=await openDB();
  const saved=await kvGet('state');
  S=saved?normalizeState(saved):seedState();
  S.asOf=today(); // luôn mở app với "Tính đến ngày" = hôm nay, để observation/audit mới nhất luôn được tính đúng kỳ KPI hiện tại
  persistOK=!!idb;
  setStatus(persistOK,persistOK?(saved?'Đã tải dữ liệu đã lưu':'Đã nạp dữ liệu mẫu từ file gốc'):'Chưa lưu được trên trình duyệt – hãy xuất JSON');
  if(!saved)saveSoon();
  render();
})();
</script>
</body>
